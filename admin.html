<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DRIFT-1 Waitlist Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root { --alu: #d8dad6; --hi: #e8e9e6; --ink: #111315; --muted: #565b5a; --line: rgba(17,19,21,.14); --led: #ff5a1f; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--alu); color: var(--ink); font: 16px/1.5 "Geist", "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 24px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); }
  form { display: flex; flex-wrap: wrap; gap: 8px; }
  label { flex-basis: 100%; font: 500 .72rem/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  input { flex: 1 1 260px; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--hi); font: inherit; }
  button { padding: 12px 18px; border-radius: 10px; border: 0; background: var(--ink); color: var(--hi); font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  :focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
  .stat { font: 600 2.4rem/1 "Geist", sans-serif; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; background: var(--hi); border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font: 500 .7rem/1 "Geist Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  td.t { font-family: "Geist Mono", monospace; color: var(--muted); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #status { min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <div>
    <h1>DRIFT‑1 waitlist</h1>
    <p>Enter the admin token you set as <code>ADMIN_TOKEN</code> in Vercel. It is kept only for this browser tab.</p>
  </div>
  <form id="auth">
    <label for="token">Admin token</label>
    <input id="token" type="password" autocomplete="off" required>
    <button type="submit">Load sign-ups</button>
  </form>
  <p id="status" role="status"></p>
  <section id="data" hidden>
    <div class="row"><span class="stat" id="count">0</span><p>people on the list</p></div>
    <div class="row" style="margin: 16px 0;">
      <button type="button" class="secondary" id="copy">Copy emails</button>
      <button type="button" class="secondary" id="refresh">Refresh</button>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Email</th><th>Joined (UTC)</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const status = $("#status");
  let token = "";
  try { token = sessionStorage.getItem("drift1-admin") || ""; } catch (e) {}
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let emails = [];

  async function load() {
    status.textContent = "Loading…";
    try {
      const r = await fetch("api/waitlist", { headers: { Authorization: "Bearer " + token, Accept: "application/json" } });
      const d = await r.json();
      if (!r.ok) { status.textContent = d.message || "The server returned an error."; return; }
      if (!d.entries) { status.textContent = "That token was not accepted. Check ADMIN_TOKEN in your Vercel project settings."; $("#data").hidden = true; return; }
      try { sessionStorage.setItem("drift1-admin", token); } catch (e) {}
      emails = d.entries.map((e) => e.email);
      $("#count").textContent = d.count.toLocaleString("en-US");
      $("#rows").innerHTML = d.entries.map((e) =>
        `<tr><td>${esc(e.email)}</td><td class="t">${e.joinedAt ? esc(e.joinedAt.replace("T", " ").slice(0, 16)) : "—"}</td></tr>`).join("") ||
        '<tr><td colspan="2">No sign-ups yet.</td></tr>';
      $("#data").hidden = false;
      status.textContent = "";
    } catch (e) {
      status.textContent = "Could not reach the API. This page only works on the deployed site.";
    }
  }
  $("#auth").addEventListener("submit", (e) => { e.preventDefault(); token = $("#token").value.trim(); load(); });
  $("#refresh").addEventListener("click", load);
  $("#copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(emails.join("\n")); status.textContent = `Copied ${emails.length} emails.`; }
    catch (e) { status.textContent = "Copy was blocked by the browser."; }
  });
  if (token) load();
})();
</script>
</body>
</html>
